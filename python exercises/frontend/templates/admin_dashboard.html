
<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .container {
            background: white;
            padding: 25px;
            margin: 20px auto;
            max-width: 800px;
            border-radius: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            background: #eaf2ff;
            padding: 20px;
            border-radius: 8px;
        }

        .card h3 {
            margin: 0 0 10px;
        }

        .card p {
            font-size: 24px;
            font-weight: bold;
        }

        a {
            color: #1769aa;
            text-decoration: none;
            margin-right: 20px;
        }
    </style>
</head>

<body>

    <h1>Admin Dashboard</h1>

    <div class="container">

        <h3>Welcome, {{ admin_name }}!</h3>
        <p>You are logged in as Admin.</p>

        <hr>

        <h2>Dashboard Overview</h2>

        <div class="stats">

            <div class="card">
                <h3>Total Workspaces</h3>
                <p>{{ total_workspaces }}</p>
            </div>

            <div class="card">
                <h3>Total Seats</h3>
                <p>{{ total_seats }}</p>
            </div>

            <div class="card">
                <h3>Total Users</h3>
                <p>{{ total_users }}</p>
            </div>

            <div class="card">
                <h3>Active Bookings</h3>
                <p>{{ active_bookings }}</p>
            </div>

        </div>

        <hr>

        <h2>Admin Management</h2>

        <a href="/admin/workspaces">Manage Workspaces</a>
        <a href="/admin/seats">Manage Seats</a>

        <br><br>

        <a href="/logout">Logout</a>

    </div>

</body>
</html>
