<!DOCTYPE html>
<html>
<head>
    <title>Available Workspaces</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Book My Seat - Workspaces</h1>

    <form action="/workspaces" method="GET">

        <input
            type="text"
            name="search"
            placeholder="Search workspace"
            value="{{ search }}"
        >

        <select name="location">
            <option value="">All Locations</option>

            {% for item in locations %}
            <option value="{{ item['location'] }}"
                {% if selected_location == item['location'] %}selected{% endif %}>
                {{ item['location'] }}
            </option>
            {% endfor %}
        </select>

        <button type="submit">Search / Filter</button>

    </form>

    <hr>

    {% for workspace in workspaces %}

        <div class="workspace-card">

            <h2>{{ workspace['workspace_name'] }}</h2>

            <p>Location: {{ workspace['location'] }}</p>

            <a href="{{ url_for('workspace_details', workspace_id=workspace['id']) }}">
                View Details
            </a>

        </div>

    {% else %}

        <p>No workspaces found.</p>

    {% endfor %}

</body>
</html>
