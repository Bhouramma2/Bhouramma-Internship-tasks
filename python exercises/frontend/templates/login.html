<!DOCTYPE html>
<html>
<head>
    <title>Login - Book My Seat</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f4f8;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 30px;
            width: 320px;
            margin: auto;
            border-radius: 10px;
        }
        input, button {
            width: 90%;
            padding: 12px;
            margin: 10px;
        }
        button {
            background: #1769aa;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Book My Seat</h2>
    <h3>Login</h3>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">

        <input type="email" name="email"
               placeholder="Enter Email" required>

        <input type="password" name="password"
               placeholder="Enter Password" required>

        <button type="submit">Login</button>

    </form>

    <p>Don't have an account?
        <a href="{{ url_for('register') }}">Register</a>
    </p>
</div>

</body>
</html>
